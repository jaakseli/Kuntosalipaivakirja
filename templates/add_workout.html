<!DOCTYPE html>
<html>

<head>
  <title>Lisää treeni</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <h1>Lisää uusi treeni</h1>

  <form action="/add_workout" method="get">
    <p>
      Harjoitteiden määrä: <br />
      <input type="number" name="exercise_count" min="1" max="20" value="{{ exercise_count }}" required />
      <input type="submit" value="Aseta määrä" />
    </p>
  </form>

  {% if exercise_count > 0 %}
  <form action="/add_workout" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <input type="hidden" name="exercise_count" value="{{ exercise_count }}" />
    <p>
      Treenin nimi: <br />
      <input type="text" name="workout_name" required />
    </p>
    <p>
      Kategoria: <br />
      <select name="category" required>
        {% for value, label in workout_categories %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      Kuvaus: <br />
      <textarea name="description" rows="5" cols="40"></textarea>
    </p>

    <h3>Harjoitteet ({{ exercise_count }})</h3>
    {% for i in range(1, exercise_count + 1) %}
    <fieldset>
      <legend>Harjoite {{ i }}</legend>
      <label>Harjoite:<br />
        <select name="exercise_category" required>
          <option value="">-- Valitse --</option>
          {% for value, label in exercise_categories %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </label><br />
      <label>Setit:<br /><input type="number" name="sets" min="1" required /></label><br />
      <label>Toistot:<br /><input type="number" name="reps" min="1" required /></label><br />
      <label>Painot (kg):<br /><input type="number" name="weight" min="0" step="0.5" required /></label>
    </fieldset>
    {% endfor %}

    <input type="submit" value="Lisää treeni" />
  </form>
  {% endif %}

  <hr />
  <p>
    <a href="/">Etusivulle</a>
  </p>
</body>

</html>
