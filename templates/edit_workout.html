<!DOCTYPE html>
<html>

<head>
  <title>Muokkaa treenia</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <h1>Muokkaa treenia</h1>

  <form action="/workouts/{{ workout.id }}/edit" method="get">
    <p>
      Harjoitteiden määrä: <br />
      <input type="number" name="exercise_count" min="1" max="20" value="{{ exercise_count }}" required />
      <input type="submit" value="Aseta määrä" />
    </p>
  </form>

  <form action="/workouts/{{ workout.id }}/edit" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <input type="hidden" name="exercise_count" value="{{ exercise_count }}" />
    <p>
      Treenin nimi: <br />
      <input type="text" name="workout_name" value="{{ workout.workout_name }}" required />
    </p>
    <p>
      Kategoria: <br />
      <select name="category" required>
        {% for value, label in workout_categories %}
        <option value="{{ value }}" {% if value == workout.category %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      Kuvaus: <br />
      <textarea name="description" rows="5" cols="40">{{ workout.description }}</textarea>
    </p>

    <h3>Harjoitteet ({{ exercise_count }})</h3>
    {% for i in range(exercise_count) %}
    <fieldset>
      <legend>Harjoite {{ i + 1 }}</legend>
      <label>Harjoite:<br />
        <select name="exercise_category" {% if i < exercises|length %}required{% endif %}>
          {% if i >= exercises|length %}
          <option value="">-- Valitse --</option>
          {% endif %}
          {% for value, label in exercise_categories %}
          <option value="{{ value }}" {% if i < exercises|length and value == exercises[i].category %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label><br />
      <label>Setit:<br /><input type="number" name="sets" min="1" value="{% if i < exercises|length %}{{ exercises[i].sets }}{% endif %}" {% if i < exercises|length %}required{% endif %} /></label><br />
      <label>Toistot:<br /><input type="number" name="reps" min="1" value="{% if i < exercises|length %}{{ exercises[i].reps }}{% endif %}" {% if i < exercises|length %}required{% endif %} /></label><br />
      <label>Painot (kg):<br /><input type="number" name="weight" min="0" step="0.5" value="{% if i < exercises|length %}{{ exercises[i].weight }}{% endif %}" {% if i < exercises|length %}required{% endif %} /></label>
    </fieldset>
    {% endfor %}

    <input type="submit" value="Tallenna" />
  </form>

  <hr />
  <p>
    <a href="/users/{{ workout.user_id }}">Takaisin</a>
  </p>
</body>

</html>
